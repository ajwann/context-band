name: Tests

on:
  # Every pull request, whatever its base branch: when it is opened, when new
  # commits are pushed to it, when it is reopened, and when a draft is marked
  # ready for review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # "Tests" is the required status check on main; keep the name stable when
    # the pinned version changes.
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The plugin hooks API is early access: the pinned version gates merging,
    # and the latest release is tried too so an upstream change shows up early.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Tests
            claude-code: '2.1.302'
            advisory: false
          - label: Tests (latest Claude Code, advisory)
            claude-code: latest
            advisory: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@${{ matrix.claude-code }}

      - name: Show version
        run: claude --version

      - name: Validate plugin
        run: claude plugin validate --strict .

      - name: Run tests
        run: claude plugin test .
